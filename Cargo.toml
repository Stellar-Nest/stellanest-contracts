[workspace]
resolver = "2"
members = [
    "types",
    "contracts/index-calculator",
    "contracts/position-manager",
    "contracts/collateral-vault",
    "contracts/price-oracle",
    "contracts/index-token-factory",
]

[workspace.dependencies]
soroban-sdk = "22.0.0"
stellanest-types = { path = "../types" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
